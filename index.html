<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freebeat - Music Video Platform</title>
    <style>
        /* 风格选择区特有样式 */
        .style-selector {
            background-color: #1E1E1E;
            padding: 20px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .style-selector h2 {
            font-size: 22px;
            text-align: center;
        }

        .style-cards {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .style-card {
            background-color: #2C2C2C;
            border-radius: 8px;
            width: 200px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            cursor: pointer;
        }

        .style-card:hover {
            background-color: #333;
        }

        .style-card .card-img {
            height: 120px;
            background-color: #555;
            border-radius: 4px;
            background-size: cover;
            background-position: center;
        }

        .style-card .card-title {
            font-weight: bold;
            font-size: 16px;
        }

        .style-card .card-desc {
            font-size: 12px;
            color: #bbb;
        }

        .style-selector .skip {
            text-align: right;
            font-size: 12px;
            color: #aaa;
            cursor: pointer;
        }

        .style-selector .skip:hover {
            color: #007bff;
        }
    </style>
</head>

<body>
    <script src="common.js"></script>
    <script>
        // 初始化公共组件
        CommonComponents.initCommon();

        // 页面加载完成后渲染组件
        document.addEventListener('DOMContentLoaded', function () {
            // 渲染侧边栏
            document.body.innerHTML = CommonComponents.getSidebarHTML() + `
                <div class="main-content">
                    ${CommonComponents.getTopNavHTML()}
                    
                    <!-- 风格选择区 -->
                    <div class="style-selector">
                        <h2>Which Style Fits Your Music?</h2>
                        <div class="style-cards">
                            <div class="style-card" data-style="SINGING">
                                <div class="card-img" style="background-image: url('https://via.placeholder.com/200x120/888/fff?text=SINGING');"></div>
                                <div class="card-title">SINGING</div>
                                <div class="card-desc">A virtual artist lip-syncing to your vocals</div>
                            </div>
                            <div class="style-card" data-style="STORYTELLING">
                                <div class="card-img" style="background-image: url('https://via.placeholder.com/200x120/888/fff?text=STORYTELLING');"></div>
                                <div class="card-title">STORYTELLING</div>
                                <div class="card-desc">A cinematic story with custom footage and scenes</div>
                            </div>
                            <div class="style-card" data-style="AUTOMATIC">
                                <div class="card-img" style="background-image: url('https://via.placeholder.com/200x120/888/fff?text=AUTOMATIC');"></div>
                                <div class="card-title">AUTOMATIC</div>
                                <div class="card-desc">Let AI listen to your track and create the magic</div>
                            </div>
                        </div>
                        <div class="skip">Skip</div>
                    </div>

                    ${CommonComponents.getTutorialsHTML()}
                    ${CommonComponents.getChartsHTML()}
                </div>
            `;

            // 初始化风格选择功能
            initStyleSelector();
        });

        // 风格选择功能
        function initStyleSelector() {
            const styleCards = document.querySelectorAll('.style-card');
            styleCards.forEach(card => {
                card.addEventListener('click', function () {
                    const styleName = this.getAttribute('data-style');
                    localStorage.setItem('selectedStyle', styleName);
                    window.location.href = 'music.html';
                });
            });

            // Skip按钮功能
            const skipBtn = document.querySelector('.style-selector .skip');
            if (skipBtn) {
                skipBtn.addEventListener('click', function () {
                    localStorage.removeItem('selectedStyle');
                    window.location.href = 'music.html';
                });
            }
        }
    </script>
</body>

</html>
