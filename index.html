<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freebeat - Music Video Platform</title>
    <style>
        /* 风格选择区特有样式 */
        .style-selector {
            background-color: #1E1E1E;
            padding: 20px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .style-selector h2 {
            font-size: 22px;
            text-align: center;
        }

        .style-cards {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .style-card {
            background-color: #2C2C2C;
            border-radius: 8px;
            width: 200px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            cursor: pointer;
        }

        .style-card:hover {
            background-color: #333;
        }

        .style-card .card-img {
            height: 120px;
            background-color: #555;
            border-radius: 4px;
            background-size: cover;
            background-position: center;
        }

        .style-card .card-title {
            font-weight: bold;
            font-size: 16px;
        }

        .style-card .card-desc {
            font-size: 12px;
            color: #bbb;
        }

        .style-selector .skip {
            text-align: right;
            font-size: 12px;
            color: #aaa;
            cursor: pointer;
        }

        .style-selector .skip:hover {
            color: #007bff;
        }
    </style>
</head>

<body>
    <script src="common.js"></script>
    <script>
        // 初始化公共组件
        CommonComponents.initCommon();

        // 页面加载完成后渲染组件
        document.addEventListener('DOMContentLoaded', function () {
            // 等待响应式导航栏初始化完成
            setTimeout(() => {
                // 确保主内容区域存在
                let mainContent = document.querySelector('.main-content');
                if (!mainContent) {
                    mainContent = document.createElement('div');
                    mainContent.className = 'main-content';
                    document.body.appendChild(mainContent);
                }

                // 渲染页面内容
                mainContent.innerHTML = `
                    ${CommonComponents.getTopNavHTML()}
                    
                    <!-- 风格选择区 -->
                    <div class="style-selector">
                        <h2>Which Style Fits Your Music?</h2>
                        <div class="style-cards">
                            <div class="style-card" data-style="SINGING">
                                <div class="card-img" style="background-image: url('public/img/palceholder (1).png');"></div>
                                <div class="card-title">SINGING</div>
                                <div class="card-desc">A virtual artist lip-syncing to your vocals</div>
                            </div>
                            <div class="style-card" data-style="STORYTELLING">
                                <div class="card-img" style="background-image: url('public/img/palceholder (2).png');"></div>
                                <div class="card-title">STORYTELLING</div>
                                <div class="card-desc">A cinematic story with custom footage and scenes</div>
                            </div>
                            <div class="style-card" data-style="AUTOMATIC">
                                <div class="card-img" style="background-image: url('public/img/palceholder (3).png');"></div>
                                <div class="card-title">AUTOMATIC</div>
                                <div class="card-desc">Let AI listen to your track and create the magic</div>
                            </div>
                        </div>
                        <div class="skip">Skip</div>
                    </div>

                    ${CommonComponents.getTutorialsHTML()}
                    ${CommonComponents.getChartsHTML()}
                `;

                // 初始化公共交互功能
                CommonComponents.initCommonInteractions();
                
                // 初始化风格选择功能
                initStyleSelector();
            }, 100); // 等待导航栏初始化
        });

        // 风格选择功能
        function initStyleSelector() {
            const styleCards = document.querySelectorAll('.style-card');
            styleCards.forEach(card => {
                card.addEventListener('click', function () {
                    const styleName = this.getAttribute('data-style');
                    
                    // 移除其他卡片的选中状态
                    styleCards.forEach(c => {
                        c.style.border = 'none';
                        c.style.backgroundColor = '#2C2C2C';
                    });
                    
                    // 高亮当前卡片
                    this.style.border = '2px solid #007bff';
                    this.style.backgroundColor = '#333';
                    
                    // 弹出确认选择弹窗
                    CommonComponents.ModalManager.create({
                        title: '确认选择',
                        content: `<p style="margin: 0; line-height: 1.5;">您选择了 <strong>${styleName}</strong> 风格，是否确认进入音乐选择页面？</p>`,
                        width: '500px',
                        buttons: [
                            {
                                text: '重新选择',
                                type: 'secondary',
                                onClick: () => {
                                    // 取消选中状态
                                    styleCards.forEach(c => {
                                        c.style.border = 'none';
                                        c.style.backgroundColor = '#2C2C2C';
                                    });
                                }
                            },
                            {
                                text: '确认进入音乐页面',
                                type: 'primary',
                                onClick: () => {
                                    localStorage.setItem('selectedStyle', styleName);
                                    CommonComponents.ToastManager.show(`已选择 ${styleName} 风格`, 'success');
                                    setTimeout(() => {
                                        window.location.href = 'music.html';
                                    }, 500);
                                }
                            },
                            {
                                text: '关闭',
                                type: 'secondary',
                                onClick: () => {
                                    // 取消选中状态
                                    styleCards.forEach(c => {
                                        c.style.border = 'none';
                                        c.style.backgroundColor = '#2C2C2C';
                                    });
                                }
                            }
                        ]
                    });
                });
            });

            // Skip按钮功能 - 居中确认弹窗
            const skipBtn = document.querySelector('.style-selector .skip');
            if (skipBtn) {
                skipBtn.addEventListener('click', function () {
                    CommonComponents.ModalManager.create({
                        title: '跳过风格选择',
                        content: '<p style="margin: 0; line-height: 1.5;">是否跳过风格选择，直接进入音乐页面？</p>',
                        width: '400px',
                        buttons: [
                            {
                                text: '取消',
                                type: 'secondary'
                            },
                            {
                                text: '确认跳过',
                                type: 'primary',
                                onClick: () => {
                                    localStorage.removeItem('selectedStyle');
                                    CommonComponents.ToastManager.show('已跳过风格选择', 'info');
                                    setTimeout(() => {
                                        window.location.href = 'music.html';
                                    }, 500);
                                }
                            }
                        ]
                    });
                });
            }
        }
    </script>
</body>

</html>
