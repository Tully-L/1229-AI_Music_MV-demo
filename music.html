<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freebeat - Choose a Music</title>
    <style>
        /* 音乐选择区特有样式 */
        .music-selector {
            background-color: #1E1E1E;
            padding: 20px;
            border-radius: 8px;
            border: 2px solid #000;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .music-selector h2 {
            font-size: 22px;
            text-align: center;
        }
        .music-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .music-tab {
            padding: 5px 10px;
            background-color: #333;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }
        .music-tab.active {
            background-color: #555;
        }
        .music-search {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: flex-end;
        }
        .music-search select {
            background-color: #333;
            border: none;
            padding: 5px;
            border-radius: 4px;
            font-size: 12px;
        }
        .music-search input {
            background-color: #333;
            border: none;
            padding: 5px;
            border-radius: 4px;
            font-size: 12px;
            width: 150px;
        }
        .music-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .music-item {
            background-color: #333;
            padding: 8px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            cursor: pointer;
        }
        .music-item:hover {
            background-color: #444;
        }
        .music-item.selected {
            background-color: #007bff !important;
            border: 2px solid #0056b3;
        }
        .music-item .img {
            width: 30px;
            height: 30px;
            background-color: #555;
            border-radius: 2px;
            background-size: cover;
            background-position: center;
        }
        .music-item .info {
            flex: 1;
        }
        .music-item .info .title {
            font-weight: bold;
        }
        .music-item .info .artist {
            color: #aaa;
            font-size: 10px;
        }
        .music-item .duration {
            color: #aaa;
        }
        .music-upload {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background-color: #333;
            border-radius: 4px;
            margin-top: 10px;
            font-size: 12px;
            cursor: pointer;
        }
        .music-upload:hover {
            background-color: #444;
        }
        .music-upload .plus {
            width: 20px;
            height: 20px;
            background-color: #555;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        .music-soundcloud {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: flex-end;
            font-size: 12px;
            color: #aaa;
        }
        .music-selector .skip {
            text-align: right;
            font-size: 12px;
            color: #aaa;
            cursor: pointer;
        }
        .music-selector .skip:hover {
            color: #007bff;
        }
    </style>
</head>
<body>
    <script src="common.js"></script>
    <script>
        // 初始化公共组件
        CommonComponents.initCommon();
        
        // 页面加载完成后渲染组件
        document.addEventListener('DOMContentLoaded', function() {
            // 渲染侧边栏
            document.body.innerHTML = CommonComponents.getSidebarHTML() + `
                <div class="main-content">
                    ${CommonComponents.getTopNavHTML()}
                    
                    <!-- 音乐选择区域 -->
                    <div class="music-selector">
                        <h2>Choose a music</h2>
                        <div>
                            <div class="music-tabs">
                                <div class="music-tab active">Trending</div>
                                <div class="music-tab">Used Tracks</div>
                            </div>
                            <div class="music-search">
                                <select>
                                    <option>All</option>
                                </select>
                                <input type="text" placeholder="Search music">
                            </div>
                            <div class="music-list">
                                <div class="music-item" data-title="The Fate of Ophelia" data-artist="Taylor Swift" data-duration="4:32">
                                    <div class="img"></div>
                                    <div class="info">
                                        <div class="title">The Fate of Ophelia</div>
                                        <div class="artist">Taylor Swift</div>
                                    </div>
                                    <div class="duration">4:32</div>
                                </div>
                                <div class="music-item" data-title="MUTT" data-artist="Leon Thomas" data-duration="3:52">
                                    <div class="img"></div>
                                    <div class="info">
                                        <div class="title">MUTT</div>
                                        <div class="artist">Leon Thomas</div>
                                    </div>
                                    <div class="duration">3:52</div>
                                </div>
                                <div class="music-item" data-title="Man I Need" data-artist="Olivia Dean" data-duration="4:24">
                                    <div class="img"></div>
                                    <div class="info">
                                        <div class="title">Man I Need</div>
                                        <div class="artist">Olivia Dean</div>
                                    </div>
                                    <div class="duration">4:24</div>
                                </div>
                                <div class="music-item" data-title="All I Want for Christmas is You" data-artist="Mariah Carey" data-duration="3:55">
                                    <div class="img"></div>
                                    <div class="info">
                                        <div class="title">All I Want for Christmas is You</div>
                                        <div class="artist">Mariah Carey</div>
                                    </div>
                                    <div class="duration">3:55</div>
                                </div>
                                <div class="music-item" data-title="Rockin' Around The Christmas Tree" data-artist="" data-duration="2:35">
                                    <div class="img"></div>
                                    <div class="info">
                                        <div class="title">Rockin' Around The Christmas Tree</div>
                                        <div class="artist"></div>
                                    </div>
                                    <div class="duration">2:35</div>
                                </div>
                                <div class="music-item" data-title="Last Christmas" data-artist="" data-duration="3:55">
                                    <div class="img"></div>
                                    <div class="info">
                                        <div class="title">Last Christmas</div>
                                        <div class="artist"></div>
                                    </div>
                                    <div class="duration">3:55</div>
                                </div>
                            </div>
                            <div class="music-upload">
                                <div class="plus">+</div>
                                <span>Upload music</span>
                            </div>
                            <div class="music-soundcloud">
                                <span>http://soundcloud.com/</span>
                            </div>
                        </div>
                        <div class="skip">Skip</div>
                    </div>

                    ${CommonComponents.getTutorialsHTML()}
                    ${CommonComponents.getChartsHTML()}
                </div>
            `;

            // 初始化音乐选择功能
            initMusicSelector();
        });

        // 音乐选择功能
        function initMusicSelector() {
            const selectedStyle = localStorage.getItem('selectedStyle');
            if (selectedStyle) {
                console.log('选中的风格:', selectedStyle);
            }

            // 为音乐项目添加点击选择功能
            const musicItems = document.querySelectorAll('.music-item');
            musicItems.forEach(item => {
                item.addEventListener('click', function() {
                    // 移除其他项目的选中状态
                    musicItems.forEach(i => i.classList.remove('selected'));
                    // 添加选中状态
                    this.classList.add('selected');
                    
                    // 保存选中的音乐信息
                    const selectedMusic = {
                        title: this.getAttribute('data-title'),
                        artist: this.getAttribute('data-artist'),
                        duration: this.getAttribute('data-duration')
                    };
                    
                    localStorage.setItem('selectedMusic', JSON.stringify(selectedMusic));
                    
                    // 自动跳转到创作页面
                    setTimeout(() => {
                        window.location.href = 'create.html';
                    }, 500);
                });
            });

            // Skip按钮功能
            const skipBtn = document.querySelector('.music-selector .skip');
            if (skipBtn) {
                skipBtn.addEventListener('click', function() {
                    localStorage.removeItem('selectedMusic');
                    window.location.href = 'create.html';
                });
            }

            // Upload music按钮功能
            const uploadBtn = document.querySelector('.music-upload');
            if (uploadBtn) {
                uploadBtn.addEventListener('click', function() {
                    alert('音乐上传功能');
                });
            }
        }
    </script>
</body>
</html>
