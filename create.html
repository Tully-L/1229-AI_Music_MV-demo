<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freebeat - Create Interface</title>
    <style>
        /* 创作区特有样式 */
        .create-section {
            background-color: #1E1E1E;
            padding: 20px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
            overflow: hidden;
        }
        .create-section::before {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40%;
            background: linear-gradient(to top, #00000080, transparent);
            z-index: 0;
        }
        .create-section h2 {
            font-size: 22px;
            text-align: center;
            z-index: 2;
        }
        .tag-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 2;
        }
        .tag {
            background-color: #333;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }
        .tag:hover {
            background-color: #555;
        }
        .tag .close {
            font-size: 10px;
            cursor: pointer;
        }
        .input-area {
            background-color: #2C2C2C;
            padding: 10px;
            border-radius: 4px;
            z-index: 2;
        }
        .input-area input {
            background-color: transparent;
            border: none;
            width: 100%;
            padding: 8px;
            font-size: 12px;
            color: #bbb;
        }
        .input-area input:focus {
            outline: 1px solid #007bff;
        }
        .feature-buttons {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            z-index: 2;
        }
        .feature-buttons button {
            background-color: #333;
            border: none;
            padding: 5px 8px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .feature-buttons .toggle {
            width: 30px;
            height: 15px;
            background-color: #555;
            border-radius: 10px;
            position: relative;
            cursor: pointer;
        }
        .feature-buttons .toggle::after {
            content: "";
            position: absolute;
            right: 2px;
            top: 2px;
            width: 11px;
            height: 11px;
            background-color: #007bff;
            border-radius: 50%;
        }
        .feature-buttons .edit {
            margin-left: auto;
            cursor: pointer;
        }
        .mode-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            z-index: 2;
        }
        .mode-bar button {
            background-color: #333;
            border: none;
            padding: 5px 8px;
            border-radius: 4px;
            cursor: pointer;
        }
        .mode-bar button.active {
            background-color: #555;
        }
        .mode-bar select {
            background-color: #333;
            border: none;
            padding: 5px;
            border-radius: 4px;
            font-size: 12px;
            margin-left: auto;
        }
        .mode-bar .create-btn {
            background-color: #007bff;
            color: #fff;
            padding: 5px 12px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .mode-bar .create-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <script src="common.js"></script>
    <script>
        // 初始化公共组件
        CommonComponents.initCommon();
        
        // 页面加载完成后渲染组件
        document.addEventListener('DOMContentLoaded', function() {
            // 渲染侧边栏
            document.body.innerHTML = CommonComponents.getSidebarHTML() + `
                <div class="main-content">
                    ${CommonComponents.getTopNavHTML()}
                    
                    <!-- 创作区域 -->
                    <div class="create-section">
                        <h2>What do you want to create?</h2>
                        <div class="tag-bar">
                            <div class="tag" id="style-tag">Storytelling</div>
                            <div class="tag" id="music-tag">
                                选择音乐
                                <span class="close">×</span>
                            </div>
                        </div>
                        <div class="input-area">
                            <input type="text" placeholder="Describe the vibe, or let us surprise you by prompting 'Make a video for this song'">
                        </div>
                        <div class="feature-buttons">
                            <button>
                                <span>Character</span>
                            </button>
                            <button>
                                <span>Lyrics</span>
                            </button>
                            <button>
                                <span>Style</span>
                            </button>
                            <span>Remove watermark</span>
                            <div class="toggle"></div>
                            <div class="edit">✎</div>
                        </div>
                        <div class="mode-bar">
                            <button>Fast</button>
                            <button class="active">Expert</button>
                            <button>Auto</button>
                            <select>
                                <option>Public</option>
                            </select>
                            <button class="create-btn">
                                <span>Create</span>
                                <span>♦</span>
                            </button>
                        </div>
                    </div>

                    ${CommonComponents.getTutorialsHTML()}
                    ${CommonComponents.getChartsHTML()}
                </div>
            `;

            // 初始化创作页面功能
            initCreatePage();
        });

        // 创作页面功能
        function initCreatePage() {
            // 显示之前选择的风格和音乐
            displaySelectedOptions();

            // 修改风格功能
            const styleTag = document.getElementById('style-tag');
            if (styleTag) {
                styleTag.addEventListener('click', function() {
                    if (confirm('要重新选择风格吗？')) {
                        window.location.href = 'index.html';
                    }
                });
            }

            // 修改音乐功能
            const musicTag = document.getElementById('music-tag');
            if (musicTag) {
                musicTag.addEventListener('click', function(e) {
                    if (e.target.classList.contains('close')) {
                        e.stopPropagation();
                        if (confirm('要移除这首音乐吗？')) {
                            localStorage.removeItem('selectedMusic');
                            musicTag.innerHTML = '选择音乐 <span class="close">×</span>';
                        }
                    } else {
                        window.location.href = 'music.html';
                    }
                });
            }

            // 创作按钮功能
            const createBtn = document.querySelector('.create-btn');
            if (createBtn) {
                createBtn.addEventListener('click', function() {
                    const inputText = document.querySelector('.input-area input').value;
                    if (inputText.trim() === '') {
                        alert('请输入创作内容！');
                        return;
                    }
                    
                    alert('开始创作：' + inputText);
                    console.log('创作内容:', inputText);
                    console.log('选中风格:', localStorage.getItem('selectedStyle'));
                    console.log('选中音乐:', localStorage.getItem('selectedMusic'));
                });
            }
        }

        // 显示选中的选项
        function displaySelectedOptions() {
            const selectedStyle = localStorage.getItem('selectedStyle');
            const selectedMusic = localStorage.getItem('selectedMusic');

            // 更新风格标签
            const styleTag = document.getElementById('style-tag');
            if (selectedStyle && styleTag) {
                styleTag.textContent = selectedStyle;
            }

            // 更新音乐标签
            const musicTag = document.getElementById('music-tag');
            if (selectedMusic && musicTag) {
                const music = JSON.parse(selectedMusic);
                musicTag.innerHTML = `${music.title} - ${music.artist} <span class="close">×</span>`;
            }
        }
    </script>
</body>
</html>
